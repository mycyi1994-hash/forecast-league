[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
no_match_path = "test/fork/*"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
bytecode_hash = "ipfs"

[rpc_endpoints]
bsc = "https://bsc-rpc.publicnode.com"

# Unit tests only by default. Fork tests need network access:  FOUNDRY_PROFILE=fork forge test
[profile.default.fuzz]
runs = 256

[profile.fork]
match_path = "test/fork/*"
no_match_path = "test/none/*"
