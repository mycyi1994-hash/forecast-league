name: Hourly live feed
# Reads the chain (no wallet, no keys), refreshes the agent feeds, requests a Pages build and checks the live site.
on:
  schedule:
    - cron: '7 * * * *'   # minute 7: after each hourly round opens, away from the busy top of the hour
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/livefeed.yml', 'keeper/livefeed.mjs', 'keeper/actionfeed.mjs', 'keeper/desk.mjs', 'keeper/transparency.mjs', 'keeper/rivals.mjs', 'keeper/finalspass.mjs', 'keeper/tick']
permissions:
  contents: write
  pages: write
concurrency:
  group: livefeed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the chain and rebuild the feeds
        run: |
          node keeper/livefeed.mjs
          node keeper/actionfeed.mjs
          node keeper/stats.mjs || echo "stats skipped"
          node keeper/finalspass.mjs || echo "finals pass skipped"
          node keeper/transparency.mjs || echo "transparency skipped"
          # Once per UTC day, on the first run that finds no row for today (a skipped schedule does not lose the day).
          if ! grep -q "\"$(date -u +%F)\"" launch/rivals/history.json 2>/dev/null; then timeout 1500 node keeper/rivals.mjs || echo "rivals skipped"; fi
          if [ "$(date -u +%H)" = "03" ]; then timeout 1200 node keeper/desk.mjs --full || echo "desk full sweep failed"; else timeout 600 node keeper/desk.mjs || echo "desk refresh failed"; fi
          node -e "require('fs').writeFileSync('docs/api/feed-status.json', JSON.stringify({lastSuccess:new Date().toISOString(), run:process.env.GITHUB_RUN_ID, state:JSON.parse(require('fs').readFileSync('docs/api/state','utf8')).updated}, null, 1)+'\n')"
      - name: Commit changed files
        run: |
          git config user.name "forecast-league-feed"
          git config user.email "forecast-league-feed@users.noreply.github.com"
          git add docs/api docs/desk docs/deployment.json docs/agent.md docs/agents.md docs/stats.json
          [ -d launch/rivals ] && git add launch/rivals || true
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "Live feed: $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done; exit 1
      - name: Request a Pages build
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "build request refused; relying on the push"
      - name: Verify the live site shows this run
        run: |
          want=$(node -e "console.log(JSON.parse(require('fs').readFileSync('docs/api/state','utf8')).updated)")
          for i in $(seq 1 30); do
            got=$(curl -fsS "https://mycyi1994-hash.github.io/forecast-league/api/state?nocache=$RANDOM" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).updated)}catch{console.log('')}})")
            [ "$got" = "$want" ] && { echo "live: $got"; exit 0; }
            sleep 30
          done
          echo "::error::live site still shows '$got', expected '$want'"; exit 1
